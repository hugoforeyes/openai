<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Đập gián tốc độ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Inter:wght@500;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar" id="topbar">
      <button id="menu-toggle" class="menu-toggle" aria-label="Toggle menu">☰</button>
      <div class="title-group">
        <p class="eyebrow">Mini Game</p>
        <h1>Đập gián tốc độ</h1>
      </div>
      <div class="controls">
        <button id="start-btn" class="btn primary">Bắt đầu</button>
        <div class="score-panel">
          <span class="label">Điểm:</span>
          <span id="score" class="score-value">0</span>
        </div>
        <div class="highscore-panel">
          <span class="label">Kỷ lục:</span>
          <span id="highscore" class="highscore-value">0</span>
        </div>
        <div class="lives" aria-live="polite">
          <span class="label">Lượt:</span>
          <span id="lives" class="life-value">3</span>
        </div>
        <button id="skill-btn" class="btn skill-btn" title="Đập toàn màn hình (Space)">
          <span class="skill-icon">💥</span>
          <span class="skill-cooldown" id="skill-cooldown"></span>
        </button>
      </div>
    </header>

    <div id="difficulty-modal" class="difficulty-modal">
      <div class="difficulty-modal-content">
        <h2>Chọn mức độ khó</h2>
        <div class="difficulty-options">
          <button class="difficulty-btn" data-difficulty="easy">
            <span class="difficulty-title">Dễ</span>
            <span class="difficulty-desc">Tốc độ chậm, nhiều lượt</span>
          </button>
          <button class="difficulty-btn" data-difficulty="medium">
            <span class="difficulty-title">Trung bình</span>
            <span class="difficulty-desc">Tốc độ vừa phải</span>
          </button>
          <button class="difficulty-btn" data-difficulty="hard">
            <span class="difficulty-title">Khó</span>
            <span class="difficulty-desc">Tốc độ nhanh, ít lượt</span>
          </button>
          <button class="difficulty-btn" data-difficulty="extreme">
            <span class="difficulty-title">Cực khó</span>
            <span class="difficulty-desc">Tốc độ rất nhanh, 1 lượt</span>
          </button>
        </div>
      </div>
    </div>

    <section class="instructions" id="instructions">
      <p>Nhấn hoặc chạm tối đa <strong>5</strong> con gián cùng lúc để gọi 5 bàn tay đập chúng. Nếu gián chạm đất mà không bị đập, bạn sẽ thua một lượt!</p>
      <p class="difficulty-indicator">Mức độ: <span id="current-difficulty">Chưa chọn</span></p>
    </section>

    <div id="game-area" class="game-area" aria-live="polite">
      <div class="hand-base">
        <div class="hand" data-index="0" aria-hidden="true"></div>
        <div class="hand" data-index="1" aria-hidden="true"></div>
        <div class="hand" data-index="2" aria-hidden="true"></div>
        <div class="hand" data-index="3" aria-hidden="true"></div>
        <div class="hand" data-index="4" aria-hidden="true"></div>
      </div>
      <div class="ground" aria-hidden="true"></div>
      <div id="explosion-container"></div>
    </div>

    <div id="status" class="status" role="status" aria-live="assertive"></div>
    <div class="mobile-overlay" id="mobile-overlay">
      <div class="mobile-stats">
        <div class="mobile-stat">
          <span class="mobile-label">Điểm:</span>
          <span id="mobile-score" class="mobile-value">0</span>
        </div>
        <div class="mobile-stat">
          <span class="mobile-label">Lượt:</span>
          <span id="mobile-lives" class="mobile-value">3</span>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
