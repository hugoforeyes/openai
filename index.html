<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đập gián tốc độ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Inter:wght@500;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="title-group">
        <p class="eyebrow">Mini Game</p>
        <h1>Đập gián tốc độ</h1>
      </div>
      <div class="controls">
        <button id="start-btn" class="btn primary">Bắt đầu</button>
        <div class="score-panel">
          <span class="label">Điểm:</span>
          <span id="score" class="score-value">0</span>
        </div>
        <div class="lives" aria-live="polite">
          <span class="label">Lượt:</span>
          <span id="lives" class="life-value">3</span>
        </div>
      </div>
    </header>

    <section class="instructions">
      <p>Nhấn tối đa <strong>5</strong> con gián cùng lúc để gọi 5 bàn tay đập chúng. Nếu gián chạm đất mà không bị đập, bạn sẽ thua một lượt!</p>
    </section>

    <div id="game-area" class="game-area" aria-live="polite">
      <div class="hand-base">
        <div class="hand" data-index="0" aria-hidden="true"></div>
        <div class="hand" data-index="1" aria-hidden="true"></div>
        <div class="hand" data-index="2" aria-hidden="true"></div>
        <div class="hand" data-index="3" aria-hidden="true"></div>
        <div class="hand" data-index="4" aria-hidden="true"></div>
      </div>
      <div class="ground" aria-hidden="true"></div>
    </div>

    <div id="status" class="status" role="status" aria-live="assertive"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
